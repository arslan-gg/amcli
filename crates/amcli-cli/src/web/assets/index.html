<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amcli</title>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <span class="brand-mark">amcli</span>
        <span id="status" class="status" title="">
          <span class="dot"></span><span class="status-text">loading</span>
        </span>
        <span class="spacer"></span>
        <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
      <span id="model-name" class="brand-model" title=""></span>
    </div>
    <div class="search-box">
      <input id="search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      <kbd>⌘K</kbd>
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <nav id="nav">
      <a href="#/views" data-page="views">Views<span class="count" data-count="views"></span></a>
      <a href="#/elements" data-page="elements">Elements<span class="count" data-count="elements"></span></a>
      <a href="#/relations" data-page="relations">Relations<span class="count" data-count="relations"></span></a>
      <a href="#/graph" data-page="graph">Graph</a>
      <a href="#/stats" data-page="stats">Stats</a>
    </nav>
    <!-- The details of whatever was last clicked — a figure on a view, a
         graph node, a table row — live here, under the menu. -->
    <aside id="details" class="details-panel" hidden>
      <div class="details-head">
        <span class="details-title">Details</span>
        <span class="spacer"></span>
        <a id="details-open" class="icon-btn" title="Maximize — open as a page" href="#">↗</a>
        <button id="details-close" class="icon-btn" title="Close" aria-label="Close">✕</button>
      </div>
      <div id="details-body" class="details-body"></div>
    </aside>
  </aside>
  <main id="main"></main>
</div>
</body>
</html>
