<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amcli</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<!-- Three panes: the rail navigates, the middle works, the inspector describes
     what is selected. The details of a concept used to live at the bottom of
     the navigation column at a third of the window's width; they belong beside
     the thing they describe. -->
<div id="app">
  <aside id="rail">
    <div id="rail-grip" class="pane-grip pane-grip-right" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize the sidebar"></div>
    <!-- The fold control leads, in both panes, so it is the one thing that never
         moves when a pane folds. -->
    <div class="rail-head">
      <button id="rail-toggle" class="btn btn-icon btn-quiet" type="button" title="Collapse the sidebar (⌘B)" aria-label="Collapse the sidebar"></button>
      <span class="brand"><span class="brand-mark">amcli</span></span>
      <span class="spacer"></span>
    </div>
    <div class="rail-body">
      <button id="open-palette" class="btn rail-search" type="button" title="Search the model (⌘K)" disabled>
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.9 10.9 13.5 13.5M10.75 7a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
        <span>Search…</span><kbd>⌘K</kbd>
      </button>
      <nav id="nav" aria-label="Sections"></nav>
      <!-- Everything that narrows what the page shows lives here, on every
           page: the folder tree, the filters, the pins. The rail is where you
           narrow; the middle is what you got. -->
      <div id="rail-context" class="rail-context"></div>
    </div>
    <div class="rail-foot">
      <div class="model-line">
        <span id="model-name" class="model-name"></span>
        <span id="model-path" class="model-path"></span>
      </div>
      <div class="rail-foot-row">
        <span id="status" class="status"><span class="dot"></span><span class="status-text">loading</span></span>
      </div>
    </div>
  </aside>

  <main id="main"></main>

  <aside id="inspector" aria-label="Details">
    <div id="inspector-grip" class="pane-grip pane-grip-left" role="separator" aria-orientation="vertical" tabindex="0" aria-controls="inspector" aria-label="Resize the details panel"></div>
    <div class="inspector-head">
      <span class="caps inspector-label">Details</span>
      <span class="spacer"></span>
      <span id="inspector-actions"></span>
      <button id="inspector-toggle" class="btn btn-icon btn-quiet" type="button" title="Narrow the details panel (⌘I)" aria-label="Narrow the details panel"></button>
    </div>
    <div id="inspector-body" class="inspector-body"></div>
  </aside>
</div>
</body>
</html>
