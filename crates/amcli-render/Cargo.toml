[package]
name = "amcli-render"
description = "Render a compiled ArchiMate view to SVG"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amcli-view.workspace = true
amcli-model.workspace = true
# The one rasteriser: pure Rust, no system libraries, so the binary stays
# static. Text and system fonts only — no raster image decoders, a view has
# nothing to decode.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
