name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rustfmt is not optional here: `xtask verify` compares against
          # rustfmt-formatted bytes, so without the component it reports drift
          # that does not exist.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The generated type tables and the packed relationship matrix must still
      # match the vendored Archi assets.
      - run: cargo xtask verify

  # Windows is the platform the id-generation and USERPROFILE fixes were for,
  # so it has to run the suite rather than merely compile: the id test only
  # fails where entropy is unavailable, and every `amcli skill` command used to
  # exit 7 here because only HOME was consulted.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

      # install.ps1 cannot be shellchecked. Parse the whole file first: -DryRun
      # exercises one branch, and the first bug here was in a branch it never
      # reaches. This covers every line for syntax, which is the class of error
      # that makes the script unusable rather than merely wrong.
      - name: the PowerShell installer parses
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\skills\amcli\scripts\install.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; throw "$($errs.Count) parse error(s)" }

      - name: the PowerShell installer keeps the stdout contract
        shell: pwsh
        run: |
          $out = & .\skills\amcli\scripts\install.ps1 -DryRun -InstallDir C:\amcli-test
          if ($out -ne 'C:\amcli-test\amcli.exe') { throw "stdout was: [$out]" }

      # -Version is interpolated into the download URL, so anything that is
      # not a tag has to be refused before it gets there.
      - name: the PowerShell installer refuses a version that is not a tag
        shell: pwsh
        run: |
          foreach ($v in @('v0.6.0/../../evil', 'main', '../../etc')) {
            & .\skills\amcli\scripts\install.ps1 -DryRun -Version $v -InstallDir C:\amcli-test 2>$null
            if ($LASTEXITCODE -eq 0) { throw "accepted -Version $v" }
          }

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # -s sh, not shellcheck's default bash dialect. The installer has to run
      # under Alpine's ash, where agents commonly live, and every bashism that
      # would break there is invisible when linting as bash.
      - run: shellcheck -s sh skills/amcli/scripts/install.sh

      # The contract the skill tells agents to rely on: stdout is the binary
      # path and nothing else.
      - name: stdout carries only the path
        run: |
          out=$(AMCLI_DRY_RUN=1 AMCLI_INSTALL_DIR=/tmp/bin sh skills/amcli/scripts/install.sh 2>/dev/null)
          test "$out" = "/tmp/bin/amcli" || { echo "stdout was: $out" >&2; exit 1; }

      # AMCLI_VERSION is interpolated into the download URL and into
      # `cargo install --tag`, so anything that is not a tag has to be refused
      # before it gets to either. A dry run is enough: the check comes first.
      - name: refuses a version that is not a tag
        run: |
          for v in 'v0.6.0/../../evil' 'main' '../../etc' 'v1;id'; do
            if AMCLI_DRY_RUN=1 AMCLI_VERSION="$v" sh skills/amcli/scripts/install.sh >/dev/null 2>&1; then
              echo "accepted AMCLI_VERSION=$v" >&2
              exit 1
            fi
          done

      # `npx skills add` loses the executable bit whenever it takes its blob
      # fast path, so the installer must work without it. The first real
      # install will take the clone path and keep the bit, which means nothing
      # else would ever exercise this.
      - name: runs without the executable bit
        run: |
          chmod 644 skills/amcli/scripts/install.sh
          AMCLI_DRY_RUN=1 sh skills/amcli/scripts/install.sh >/dev/null
