# Provenance of vendored third-party assets.
#
# These files come from the Archi source repository and are MIT licensed
# (see LICENSE.archi.txt, reproduced verbatim from the repository root).
#
# `cargo xtask update-matrix --tag <tag>` re-fetches them and regenerates the
# packed tables. CI fails if the generated bytes change without a matching bump
# here, so an upstream Archi update always shows up as a reviewable diff.

[source]
repository = "https://github.com/archimatetool/archi"
tag = "release_5.9.0"
license = "MIT"
fetched = "2026-08-11"

[[files]]
path = "relationships.xml"
upstream = "com.archimatetool.model/model/relationships.xml"
sha256 = "65ad5b5c8044fc62c61836a702d0bd2e0427a87216d7f5e397666c74508d57c5"
bytes = 229198
# <relationships version="3.2">, 62 source concepts x 62 targets.
# Cell value is a set of key letters; this is the derivation-CLOSED table.

[[files]]
path = "relationships-keys.xml"
upstream = "com.archimatetool.model/model/relationships-keys.xml"
sha256 = "19d86924efc3364d26c162fe4e6643f37fd9493a0effc80ce5e2aa648fb6803e"
bytes = 763
# Key letter -> relationship type. 11 entries.

[[files]]
path = "viewpoints.xml"
upstream = "com.archimatetool.model/model/viewpoints.xml"
sha256 = "a101699683fe7a92e4f62d6a389712a92fe2792fe36cb2a0614815aca21211c8"
bytes = 9279
# <viewpoints version="3.0">, 25 viewpoints. Concept lists may contain macros
# ($BusinessElements$, $ApplicationElements$, $TechnologyElements$,
# $PhysicalElements$, $StrategyElements$, $MotivationElements$,
# $ImplementationMigrationElements$) which expand to the layer's element set.
# An EMPTY concept list means "everything is allowed", evaluated independently
# for elements and for relationships.

